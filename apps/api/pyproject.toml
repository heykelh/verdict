[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verdict-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["verdict_api"]
