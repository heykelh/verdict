name: Base de prix de reference

# Le 1er de chaque mois a 5 h (UTC), et a la demande depuis l'onglet Actions.
on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le moteur
        run: pip install -e packages/core

      - name: Construire la base de prix
        env:
          VERDICT_APIFY_TOKEN: ${{ secrets.VERDICT_APIFY_TOKEN }}
        run: python scripts/build_reference.py

      - name: Enregistrer le fichier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/prix-reference.json
          git diff --cached --quiet || git commit -m "data: base de prix de reference"
          git pull --rebase origin main
          git push
